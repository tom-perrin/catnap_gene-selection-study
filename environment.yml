# Environment for the HVG selection study, run
#    conda env create -f environment.yml

name: hvg_selection

channels:
  - conda-forge

dependencies:
  - python=3.11

  - numpy=2.2.6
  - scipy=1.15.2
  - pandas=2.3.3
  - anndata=0.11.4
  - scanpy=1.11.5
  - scikit-misc=0.5.2

  - scikit-learn=1.7.2
  - lightgbm=4.6.0

  - matplotlib-base=3.11.0

  - hdf5plugin>=4.3
  - joblib>=1.3
  - pyyaml>=6.0
  - tqdm>=4.66
  - ipykernel<7
  - ipywidgets>=8
  - pip

# After activating the environment, run
#    pip install -e <path to the catnap_core repo>